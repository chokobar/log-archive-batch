spring.application.name=Log Archive Batch
server.port=8088
# ===== MySQL Datasource =====
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/spring_batch?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2104}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===== JPA =====
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=false

# ===== Spring Batch =====
# Auto create batch tables
spring.batch.jdbc.initialize-schema=always

# Disable auto job run
spring.batch.job.enabled=false
